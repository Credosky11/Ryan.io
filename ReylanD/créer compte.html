<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer compte</title>
    <link rel="stylesheet" href="création.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <form action="">
            <h1>Créer un compte</h1>
                <div class="input-box">
                    <input type="text" placeholder="Adresse Email" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Mot de passe" required>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Nom" required>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="Prénom(s)" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="créer mot de passe" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="confirmer mot de passe" required>
                </div>
                <div class="confirmer-identité">
                    <label><input type="checkbox">je ne suis un robot</label>
                </div>
                <button type="submit" class="btn">Créer</button>
                <div class="créer-link">
                    <p>Vous avez un compte?<a href="se connecter.html">Se connecter</a></p>
                </div>
        </form>
    
    
</body>
</html>
